version: 3
allow:
  depOnAnyVendor: false
  # deepScan checks the component receiving an injection, so every adapter bootstrap wires into a consumer
  # would fail it (ADR-0007).
  deepScan: false
  # Components are declared up front for packages the build adds later.
  ignoreNotFoundComponents: true

excludeFiles:
  # Fixtures that break the rules on purpose, ignored by the Go toolchain too.
  - "/testdata/"
  # npm packages can ship Go files of their own, as flatted does.
  - "/node_modules/"
  # The agent hooks are a module of their own, linted and tested on their own.
  - "/tools/agenthook/"

vendors:
  templ:
    in:
      - github.com/a-h/templ
      - github.com/a-h/templ/**
  pgx:
    in:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/**
  go-redis:
    in:
      - github.com/redis/go-redis/v9
      - github.com/redis/go-redis/v9/**
  argon2:
    in: golang.org/x/crypto/argon2
  goose:
    in:
      - github.com/pressly/goose/v3
      - github.com/pressly/goose/v3/**
  config:
    in:
      # `/**` does not match the module's root package, which is all godotenv has.
      - github.com/joho/godotenv
      - github.com/caarlos0/env/**
  gofakeit:
    in: github.com/brianvoe/gofakeit/v7/**
  # depguard keeps it out of non-test files.
  testify:
    in: github.com/stretchr/testify/**
  # depguard keeps it out of non-test files.
  goquery:
    in: github.com/PuerkitoBio/goquery
  # depguard keeps it out of non-test files.
  gomock:
    in: go.uber.org/mock/**
  # depguard keeps it out of non-test files.
  playwright:
    in: github.com/mxschmitt/playwright-go

commonVendors:
  - testify
  - gomock

components:
  cmd:
    in: cmd/**
  bootstrap:
    in: internal/bootstrap/**
  domain:
    in: internal/domain/**
  action:
    in: internal/action/**
  request:
    in: internal/request/**
  validate:
    in: internal/validate/**
  handler:
    in: internal/handler/**
  job:
    in: internal/job/**
  worker:
    in: internal/worker/**
  middleware:
    in: internal/middleware/**
  web:
    in: internal/web/**
  view:
    in: internal/view/**
  route:
    in: internal/route/**
  asset:
    in: internal/asset/**
  buildinfo:
    in: internal/buildinfo/**
  adapter:
    in: internal/adapter/**
  adapter-postgres:
    in: internal/adapter/postgres/**
  adapter-valkey:
    in: internal/adapter/valkey/**
  adapter-goose:
    in: internal/adapter/goose/**
  adapter-argon2id:
    in: internal/adapter/argon2id/**
  migrations:
    in: migrations/**
  migrationsum:
    in: internal/migrationsum/**
  seed:
    in: internal/seed/**
  factory:
    in: internal/factory/**
  testsupport:
    in: internal/testsupport/**
  architecture-test:
    in: tests/architecture/**
  hooks-test:
    in: tests/hooks/**
  feature-test:
    in: tests/feature/**
  e2e-test:
    in: tests/e2e/**

deps:
  cmd:
    mayDependOn:
      - bootstrap
  bootstrap:
    mayDependOn:
      - bootstrap
      - domain
      - action
      - request
      - validate
      - handler
      - job
      - worker
      - middleware
      - web
      - view
      - route
      - asset
      - adapter
      - adapter-postgres
      - adapter-valkey
      - adapter-goose
      - adapter-argon2id
      - migrations
      - migrationsum
      - seed
      - buildinfo
    canUse:
      - config
  action:
    mayDependOn:
      - domain
  request:
    mayDependOn:
      - request
      - domain
      - validate
  validate:
    mayDependOn:
      - domain
  handler:
    mayDependOn:
      - handler
      - domain
      - action
      - request
      - validate
      - middleware
      - web
      - view
      - route
  job:
    mayDependOn:
      - domain
      - action
  # The worker runtime reaches the queue only through its own jobStore interface (ADR-0012).
  worker:
    mayDependOn:
      - worker
      - domain
  middleware:
    mayDependOn:
      - middleware
      - domain
      - web
      - route
  web:
    mayDependOn:
      - web
      - domain
      - view
      - route
    # depguard keeps it in the tests, which parse the rendered pages.
    canUse:
      - goquery
  asset:
    mayDependOn:
      - asset
  view:
    mayDependOn:
      - view
      - route
    canUse:
      - templ
  adapter:
    mayDependOn:
      - adapter
      - domain
  adapter-postgres:
    mayDependOn:
      - adapter-postgres
      - domain
      # Its integration tests run each in a database of their own.
      - testsupport
      # Its job queue integration tests run jobs through the worker runtime and stamp IDs with the UUIDv7 generator.
      - worker
      - adapter
    canUse:
      - pgx
  adapter-valkey:
    mayDependOn:
      - adapter-valkey
      - domain
      # Its integration tests run each under a key prefix of their own.
      - testsupport
    canUse:
      - go-redis
  adapter-goose:
    mayDependOn:
      - adapter-goose
      - domain
      # goose needs a database/sql handle, which it opens on the Postgres pool.
      - adapter-postgres
      # Its integration tests run each in a database of their own.
      - testsupport
    canUse:
      - goose
  adapter-argon2id:
    mayDependOn:
      - adapter-argon2id
      - domain
    canUse:
      - argon2
  migrations:
    mayDependOn:
      - migrations
      - migrationsum
  migrationsum:
    mayDependOn:
      - migrationsum
  seed:
    mayDependOn:
      - domain
      - action
      - factory
  factory:
    mayDependOn:
      - domain
      - adapter-postgres
    canUse:
      - gofakeit
  testsupport:
    mayDependOn:
      - testsupport
      - migrationsum
      # The test database harness migrates its template database the way cmd/migrate does.
      - migrations
      - adapter-postgres
      - adapter-goose
      - adapter-valkey
      # Feature and e2e tests build the real app the way cmd/web does (ADR-0011).
      - bootstrap
    canUse:
      - pgx
  architecture-test:
    mayDependOn:
      - architecture-test
  feature-test:
    mayDependOn:
      - bootstrap
      - testsupport
      - factory
      - domain
      - route
      # Mounts probe routes on the app's mux through the Responder.
      - web
      # Registers a probe job on the worker app.
      - worker
    canUse:
      - goquery
  e2e-test:
    mayDependOn:
      - bootstrap
      - testsupport
      - factory
      - domain
      - route
    canUse:
      - playwright
