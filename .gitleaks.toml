[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures hold fake secrets, such as TOTP seeds, on purpose."
paths = [
  '''_test\.go$''',
  '''(^|/)testdata/''',
]

[[allowlists]]
description = "The migration sum file pairs each file name, such as one naming secrets or tokens, with a hash."
paths = ['''(^|/)migrations/migrations\.sum$''']
