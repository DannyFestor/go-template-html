version: "2"

run:
  # Agent hooks lint while other sessions or a human lint too, so a run waits for the lock instead of failing.
  allow-serial-runners: true

linters:
  default: all
  disable:
    - gocyclo # cyclop measures the same complexity.
    - lll # golines wraps long lines when formatting.
    - varnamelen # Short names are idiomatic Go for receivers, loop indices and small scopes.
    - exhaustruct # Deprecated, superseded by exhaustruct_v5.
    - gomodguard # Deprecated, superseded by gomodguard_v2.
    - wsl # Deprecated, superseded by wsl_v5.

  settings:
    cyclop:
      max-complexity: 10
    depguard:
      rules:
        core-without-io:
          files:
            - "**/internal/domain/**"
            - "**/internal/action/**"
            - "**/internal/request/**"
            - "**/internal/validate/**"
          deny:
            - pkg: net/http
              desc: core layers stay transport-agnostic (ADR-0002)
            - pkg: database/sql
              desc: core layers reach storage through adapters (ADR-0002)
        # go-arch-lint reads test and non-test files alike, so it cannot confine test-only libraries.
        test-only-libraries:
          files:
            - $all
            - "!$test"
            - "!**/internal/testsupport/**"
          deny:
            - pkg: github.com/stretchr/testify
              desc: test-only, imported by tests and internal/testsupport (ADR-0007)
            - pkg: github.com/PuerkitoBio/goquery
              desc: test-only, imported by tests and internal/testsupport (ADR-0007)
            - pkg: go.uber.org/mock
              desc: test-only, imported by tests and the _test.go mocks mockgen writes (ADR-0007)
            - pkg: github.com/mxschmitt/playwright-go
              desc: test-only, imported by the e2e tests (ADR-0011)
        no-reflect:
          deny:
            - pkg: reflect$
              desc: wiring is explicit, never reflective (ADR-0002)
    forbidigo:
      forbid:
        - pattern: ^context\.WithValue$
          msg: only adapter/postgres and middleware put values in ctx (ADR-0002)
      analyze-types: true
    funlen:
      lines: 40
      statements: 25
    gocognit:
      min-complexity: 12
    gocritic:
      enabled-checks:
        - commentedOutCode
    gomodguard_v2:
      allowed:
        # An empty allowlist allows every module, so the list starts with the main module.
        - module: github.com/DannyFestor/go-template-html
        - module: github.com/caarlos0/env/v11
        - module: github.com/joho/godotenv
        - module: github.com/stretchr/testify
        - module: github.com/a-h/templ
        - module: github.com/PuerkitoBio/goquery
        - module: github.com/jackc/pgx/v5
        - module: github.com/pressly/goose/v3
        - module: github.com/redis/go-redis/v9
        - module: github.com/klauspost/compress
        - module: github.com/vearutop/statigz
        - module: go.uber.org/mock
        - module: golang.org/x/crypto
        - module: github.com/mxschmitt/playwright-go
        - module: github.com/brianvoe/gofakeit/v7
        - module: github.com/coder/websocket
        # Required only by the agent hooks' own module, tools/agenthook.
        - module: mvdan.cc/sh/v3
    importas:
      no-extra-aliases: true
      alias:
        # A job package shares its area's name with the action package that bootstrap wires into it.
        - pkg: github.com/DannyFestor/go-template-html/internal/job/(\w+)
          alias: ${1}job
        # A handler package shares its area's name with the action package that bootstrap wires into it.
        - pkg: github.com/DannyFestor/go-template-html/internal/handler/(\w+)
          alias: ${1}handler
        # The websocket adapter's black-box tests import the library, which has the adapter's package name.
        - pkg: github.com/coder/websocket
          alias: coderws
    interfacebloat:
      max: 5
    nestif:
      min-complexity: 4
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        - name: argument-limit
          arguments: [5]
        - name: function-result-limit
          arguments: [3]
        # An action file holds <X>, <X>In and <X>Out.
        - name: max-public-structs
          arguments: [3]
        - name: file-length-limit
          arguments:
            - max: 300
              skip-comments: true
              skip-blank-lines: true
        - name: import-alias-naming
        - name: confusing-naming
        # Comments explain why, so none are mandated.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - funlen
          - dupl
          - goconst
          - mnd
          - maintidx
      - path: internal/(adapter/postgres|middleware)/
        linters:
          - forbidigo
        text: context\.WithValue

formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    goimports:
      local-prefixes:
        - github.com/DannyFestor/go-template-html
    golines:
      max-len: 120
