# Every job calls a Make target, so hooks need nothing on PATH beyond the system tools and Go.
# The installed git hooks otherwise look for whichever lefthook is on PATH, not the pinned one.
lefthook: go tool -modfile=tools/tools.mod lefthook
glob_matcher: doublestar

pre-commit:
  piped: true
  jobs:
    - name: refuse-main
      run: make -s refuse-commit-on-main
    - name: fmt-go
      glob: "**/*.go"
      run: make -s fmt FILES="{staged_files}"
      stage_fixed: true
    - name: fmt-js
      glob:
        - "**/*.ts"
        - "**/*.css"
        - "**/*.json"
      run: make -s fmt-js FILES="{staged_files}"
      stage_fixed: true
    - name: lint-shell
      glob: "**/*.sh"
      run: make -s lint-shell FILES="{staged_files}"
    - name: lint-secrets
      run: make -s lint-secrets

commit-msg:
  jobs:
    - name: lint-commit-msg
      run: make -s lint-commit-msg COMMIT_MSG_FILE="{1}"

pre-push:
  piped: true
  jobs:
    # GitHub does not enforce rulesets on private repos of free accounts.
    - name: refuse-main
      run: make -s refuse-push-to-main
      use_stdin: true
    - name: lint-go
      files: &changed-files scripts/changed-files.sh
      glob: "**/*.go"
      exclude:
        - "**/testdata/**"
        - &agenthook-module tools/agenthook/**
      run: make -s lint FILES="{files}"
    - name: arch
      files: *changed-files
      glob:
        - "**/*.go"
        - go.mod
        - .go-arch-lint.yml
      exclude:
        - *agenthook-module
      run: make -s arch
    - name: test-go
      files: *changed-files
      glob:
        - "**/*.go"
        - "**/*.templ"
        - "**/*.sql"
        - "**/*.sh"
        - go.mod
        - go.sum
      exclude:
        - *agenthook-module
      run: make -s test-go
    # The agent hooks are a Go module of their own, so the jobs above, which run in the root module, skip them.
    - name: lint-agenthook
      files: *changed-files
      glob: "tools/agenthook/**/*.go"
      exclude:
        - "**/testdata/**"
      run: make -s lint-agenthook
    - name: test-agenthook
      files: *changed-files
      glob: *agenthook-module
      run: make -s test-agenthook
    - name: typecheck-js
      files: *changed-files
      glob: &frontend-inputs
        - internal/asset/src/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .node-version
        - tsconfig.json
        - vite.config.ts
      run: make -s typecheck-js
    - name: lint-js
      files: *changed-files
      glob: *frontend-inputs
      run: make -s lint-js
    - name: test-js
      files: *changed-files
      glob: *frontend-inputs
      run: make -s test-js
